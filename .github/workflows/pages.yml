name: Panel Pages

# Her main push'unda admin paneli derleyip GitHub Pages'e yayınlar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Yayınla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm kurulumu
        uses: pnpm/action-setup@v6

      - name: Node.js kurulumu
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      - name: Vite build
        run: pnpm build

      - name: Pages yapılandırması
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artifact yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
